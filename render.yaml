services:
  - type: web
    name: stegoshield
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_CONTENT_LENGTH_MB
        value: "10"
      - key: RATE_LIMIT_DEFAULT
        value: "60 per minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10 per minute"
      # Optional - see README "Authentication". Leaving these unset
      # disables login entirely; the public demo is unaffected either
      # way. Set as real values in the Render dashboard, never here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
