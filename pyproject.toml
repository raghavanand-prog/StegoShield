[project]
name = "stegoshield"
version = "1.0.0"
requires-python = ">=3.11"
# Vercel's build (uv) installs from [project.dependencies], not
# requirements.txt, once a pyproject.toml is present - discovered via
# an actual failed build ("No module named 'numpy'") where uv installed
# nothing at all. This list is the production runtime subset of
# requirements.txt (pytest is dev/test-only, so it's omitted here to
# keep the deployed bundle smaller). Keep the two files in sync.
dependencies = [
    "Flask==3.1.3",
    "Flask-Limiter==4.1.1",
    "Pillow==12.3.0",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "joblib==1.5.3",
    "python-magic==0.4.27",
    "pylibmagic==0.5.0",
    "python-dotenv==1.2.2",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python build_vercel.py"
